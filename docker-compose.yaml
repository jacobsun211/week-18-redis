services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: user 
      MONGO_INITDB_ROOT_PASSWORD: password 
      MONGO_INITDB_DATABASE: alerts
    networks:
      - week18


  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - week18



